aid: finku
name: Finku
description: >-
  Finku is an AI-based personal finance management (PFM) mobile app from Indonesia,
  recognized as the number-one Indonesia PFM app and a Google Play "Best of 2025"
  selection with more than one million users. It helps people track expenses, set
  budgets, and build better money habits through manual entry, receipt and bank
  e-statement scanning, and FinGPT, a chat-based AI financial assistant. The app
  connects multiple banks and e-wallets, generates real-time interactive dashboards
  and reports, and runs a freemium model with a Premium tier. Finku is registered
  with Indonesian regulators OJK, Kominfo, AFTECH, and AFPI, and secures user data
  with 256-bit AES encryption. Finku is a consumer application and does not currently
  publish a public developer API, SDK, or developer portal; this profile originated
  as a VC-portfolio lead for the API Evangelist network.
